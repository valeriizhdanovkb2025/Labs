[project]
name = "laba4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "valeriizhdanovkb2025", email = "valerii.zhdanov.kb.2025@lpnu.ua" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pyodbc>=5.3.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
laba4 = "laba4:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]
